<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="湖南科技大学“翎航者”科创实践团三下乡新闻报道汇总">
</head>
<body>
<title>翎航者三下乡新闻</title>
<style>
/* ============ 全局变量：修改主色调只需改这里 ============ */
:root{
  --primary:#1a5276;      /* 主色（深蓝） */
  --accent:#2e86c1;       /* 辅助色（亮蓝） */
  --accent-soft:#eaf3fa;  /* 浅蓝底 */
  --ink:#1c2b36;          /* 正文文字 */
  --ink-2:#5b6b78;        /* 次级文字 */
  --line:#e2e8ef;         /* 分割线 */
  --bg:#f5f8fb;           /* 页面背景 */
  --card:#ffffff;         /* 卡片背景 */
  --star:#f0a500;         /* 收藏星标色 */
  --shadow:0 1px 3px rgba(26,82,118,.08);
  --shadow-hover:0 10px 24px rgba(26,82,118,.16);
  --radius:12px;
  --maxw:1120px;
}
/* 本页面按需求固定为「蓝色系 + 白色背景」的浅色配色，
   所有颜色均由上方 token 显式定义，不随系统深色模式反转。 */
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Helvetica,Arial,sans-serif;
  line-height:1.6; -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 16px}
/* 键盘焦点可见 */
a:focus-visible,button:focus-visible,input:focus-visible{
  outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px;
}
/* 尊重「减少动态效果」系统偏好 */
@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important;scroll-behavior:auto !important}
}

/* ============ 顶部横幅 ============ */
.banner{
  background:linear-gradient(135deg,#0d3a58 0%,var(--primary) 42%,var(--accent) 100%);
  color:#fff; padding:36px 0 40px; position:relative; overflow:hidden;
}
.banner::after{ /* 装饰性光斑 */
  content:"";position:absolute;right:-80px;top:-80px;width:300px;height:300px;
  background:radial-gradient(circle,rgba(255,255,255,.16),transparent 70%);border-radius:50%;
}
.brand{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
/* LOGO：透明底、无边框、无发光，直接使用团队徽标原色 */
.logo{width:58px;height:58px;flex:none;display:flex;align-items:center;justify-content:center}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.brand h1{margin:0;font-size:clamp(20px,4.4vw,28px);font-weight:700;letter-spacing:.5px}
.brand .sub{margin:2px 0 0;font-size:13px;opacity:.85;letter-spacing:2px}
.intro{
  position:relative;z-index:1;margin:18px 0 0;max-width:760px;
  font-size:14.5px;line-height:1.85;color:rgba(255,255,255,.92);
}
.stats{position:relative;z-index:1;display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.stat{
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);
  border-radius:999px;padding:5px 14px;font-size:13px;
}

/* ============ 工具栏（搜索 + 筛选） ============ */
.toolbar{
  position:sticky;top:0;z-index:50;background:var(--card);
  border-bottom:1px solid var(--line);box-shadow:var(--shadow);
}
.toolbar-inner{padding:14px 16px}
.searchbox{position:relative;display:flex;align-items:center}
.searchbox svg{position:absolute;left:14px;width:18px;height:18px;color:var(--ink-2);pointer-events:none}
#search{
  width:100%;padding:11px 40px 11px 42px;font-size:15px;color:var(--ink);
  border:1.5px solid var(--line);border-radius:999px;background:var(--bg);
  font-family:inherit;outline:none;transition:border-color .2s, box-shadow .2s;
}
#search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(46,134,193,.15)}
#clearSearch{
  position:absolute;right:8px;width:26px;height:26px;border:0;border-radius:50%;
  background:var(--line);color:var(--ink-2);cursor:pointer;display:none;
  font-size:15px;line-height:1;font-family:inherit;
}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{
  border:1.5px solid var(--line);background:transparent;color:var(--ink-2);
  padding:6px 14px;border-radius:999px;font-size:13.5px;cursor:pointer;
  font-family:inherit;transition:all .18s;white-space:nowrap;
}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff}
.chip.fav.active{background:var(--star);border-color:var(--star);color:#3b2a00}
.status{margin-top:10px;font-size:13px;color:var(--ink-2)}
.status b{color:var(--accent);font-weight:600}

/* ============ 新闻卡片 ============ */
.list{display:grid;gap:14px;padding:22px 0 40px;grid-template-columns:1fr}
@media(min-width:860px){.list{grid-template-columns:1fr 1fr}}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 16px 12px;box-shadow:var(--shadow);
  transition:transform .22s ease, box-shadow .22s ease, border-color .22s ease;
  display:flex;flex-direction:column;
}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover);border-color:var(--accent)}
.card-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.num{
  flex:none;min-width:30px;height:24px;padding:0 7px;border-radius:6px;
  background:var(--accent-soft);color:var(--accent);
  font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;
}
.badge{
  flex:none;font-size:12px;padding:2px 9px;border-radius:999px;
  background:var(--primary);color:#fff;font-weight:500;
}
/* 各媒体徽章配色（新湖南沿用主色，其余各自区分） */
.badge[data-g="中国日报"]{background:#c0392b}
.badge[data-g="中国经济时报"]{background:#7d3c98}
.badge[data-g="中华网"]{background:#1e8449}
.badge[data-g="湖南日报"]{background:#b9770e}
.badge[data-g="鲁网"]{background:#117a8b}
.badge[data-g="大学生网"]{background:#5b6b78}
.badge[data-g="其他"]{background:#5b6b78}
.star{
  margin-left:auto;flex:none;border:0;background:transparent;cursor:pointer;
  font-size:19px;line-height:1;color:var(--ink-2);padding:2px 4px;transition:transform .15s,color .15s;
}
.star:hover{transform:scale(1.2)}
.star.on{color:var(--star)}
.title{
  font-size:15.5px;font-weight:600;line-height:1.65;color:var(--ink);
  margin:0 0 10px;flex:1;transition:color .18s;
}
.card:hover .title{color:var(--accent)}
.title mark{background:#ffe9a8;color:#7a4b00;border-radius:3px;padding:0 2px}
.card-foot{
  display:flex;align-items:center;gap:8px;
  border-top:1px dashed var(--line);padding-top:10px;margin-top:auto;
}
.btn{
  border:1.5px solid var(--line);background:transparent;color:var(--ink-2);
  border-radius:8px;padding:5px 12px;font-size:13px;cursor:pointer;
  font-family:inherit;display:inline-flex;align-items:center;gap:5px;transition:all .18s;
}
.btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.btn.primary{border-color:var(--accent);color:var(--accent)}
.btn svg{width:14px;height:14px}
.host{margin-left:auto;font-size:11.5px;color:var(--ink-2);opacity:.75;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:45%}
.empty{
  grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--ink-2);
  border:1.5px dashed var(--line);border-radius:var(--radius);
}
.empty .big{font-size:34px;margin-bottom:8px}

/* ============ 页脚 / 回到顶部 / 提示条 ============ */
footer{
  border-top:1px solid var(--line);background:var(--card);
  padding:22px 0 34px;text-align:center;color:var(--ink-2);font-size:13.5px;
}
footer .count{font-size:15px;color:var(--ink);font-weight:600}
#toTop{
  position:fixed;right:20px;bottom:20px;width:44px;height:44px;border-radius:50%;
  border:0;background:var(--primary);color:#fff;cursor:pointer;z-index:80;
  box-shadow:0 6px 18px rgba(26,82,118,.35);
  display:flex;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;transform:translateY(12px);transition:all .25s;
}
#toTop.show{opacity:1;visibility:visible;transform:none}
#toTop:hover{background:var(--accent)}
#toTop svg{width:20px;height:20px}
#toast{
  position:fixed;left:50%;bottom:34px;transform:translate(-50%,16px);
  background:rgba(26,43,54,.94);color:#fff;padding:10px 20px;border-radius:999px;
  font-size:14px;z-index:120;opacity:0;visibility:hidden;transition:all .25s;
  box-shadow:0 8px 24px rgba(0,0,0,.25);
}
#toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}
/* ============ 移动端适配 ============ */
@media(max-width:600px){
  .banner{padding:24px 0 28px}
  .brand h1{letter-spacing:0}
  .intro{font-size:14px;line-height:1.8;margin-top:14px}
  .stats{gap:8px;margin-top:14px}
  .stat{font-size:12.5px;padding:4px 12px}
  .list{padding:14px 0 30px}
  .host{display:none}
  /* 收紧吸顶工具栏高度，避免占用过多手机屏幕 */
  .toolbar-inner{padding:10px 16px}
  #search{padding:10px 38px 10px 40px;font-size:14.5px}
  .chip{padding:5px 12px;font-size:13px}
  .status{margin-top:8px;font-size:12.5px}
  /* 筛选按钮改为单行横向滑动，不再换行堆叠 */
  .filters{
    flex-wrap:nowrap;overflow-x:auto;margin:10px -16px 0;padding:0 16px 2px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  .filters::-webkit-scrollbar{display:none}
  .card{padding:14px 14px 10px}
  .title{font-size:15px}
  #toTop{right:14px;bottom:14px;width:42px;height:42px}
}
/* 超窄屏（<=360px）进一步压缩 */
@media(max-width:360px){
  .logo{width:48px;height:48px}
  .brand h1{font-size:19px}
  .brand .sub{font-size:11px;letter-spacing:1px}
  .btn{padding:5px 10px;font-size:12.5px}
}
</style>

/* 媒体列表：按含金量由高到低，既是筛选按钮顺序，也是卡片排序依据 */
const GROUPS = ["中国日报", "中国经济时报", "中华网", "湖南日报", "新湖南", "鲁网", "大学生网"];

/* ---------------------- 全局状态 ---------------------- */
let keyword   = "";        // 当前搜索关键词
let group     = "全部";     // 当前媒体筛选
let favOnly   = false;      // 是否只看收藏
const favSet  = new Set();  // 已收藏的新闻序号

/* 收藏状态本地持久化（浏览器不支持时静默降级为仅本次会话有效） */
const STORE_KEY = "lhz-news-fav-v3";
try{
  const saved = localStorage.getItem(STORE_KEY);
  if(saved) JSON.parse(saved).forEach(function(i){ favSet.add(i); });
}catch(e){ /* 忽略：隐私模式或 file:// 下不可用 */ }
function saveFav(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify([...favSet])); }catch(e){}
}

/* ---------------------- 工具函数 ---------------------- */
/* HTML 转义，防止标题中的特殊字符破坏结构 */
function esc(s){
  return s.replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
/* 正则转义，用于关键词高亮 */
function escRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }
/* 标题高亮：把匹配到的关键词包进 <mark> */
function highlight(title){
  const safe = esc(title);
  if(!keyword) return safe;
  return safe.replace(new RegExp("("+escRe(esc(keyword))+")","gi"), "<mark>$1</mark>");
}
/* 外链图标（复用，避免重复拼接长 SVG） */
const ICON_LINK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M21 14v7H3V3h7"/></svg>';

/* 取域名，用于卡片右下角的小字提示 */
function hostOf(url){ try{ return url.split("/")[2]; }catch(e){ return ""; } }

/* 轻提示 */
let toastTimer = null;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 1800);
}

/* ---------------------- 筛选按钮 ---------------------- */
function buildFilters(){
  const box = document.getElementById("filters");
  const items = [{k:"全部",label:"全部",n:NEWS.length}];
  GROUPS.forEach(function(g){
    const n = NEWS.filter(function(x){ return x.g===g; }).length;
    if(n>0) items.push({k:g,label:g,n:n});
  });
  box.innerHTML = items.map(function(it){
    return '<button class="chip" data-g="'+it.k+'">'+it.label+' <span style="opacity:.7">'+it.n+'</span></button>';
  }).join("") + '<button class="chip fav" id="favBtn">☆ 我的收藏 <span id="favCount" style="opacity:.7">0</span></button>';

  box.querySelectorAll(".chip[data-g]").forEach(function(btn){
    btn.addEventListener("click", function(){
      group = btn.dataset.g;
      favOnly = false;         // 切换媒体筛选时退出“只看收藏”
      render();
    });
  });
  document.getElementById("favBtn").addEventListener("click", function(){
    favOnly = !favOnly;
    render();
  });
}

/* ---------------------- 过滤 + 渲染 ---------------------- */
function filtered(){
  const kw = keyword.toLowerCase();
  return NEWS.filter(function(n){
    if(group !== "全部" && n.g !== group) return false;
    if(favOnly && !favSet.has(n.i)) return false;
    if(kw && n.t.toLowerCase().indexOf(kw) === -1) return false;
    return true;
  });
}

function render(){
  const data = filtered();
  const list = document.getElementById("list");

  /* 卡片 */
  if(data.length === 0){
    list.innerHTML = '<div class="empty"><div class="big">🔍</div>没有找到匹配的新闻，换个关键词或筛选条件试试。</div>';
  }else{
    list.innerHTML = data.map(function(n){
      const on = favSet.has(n.i);
      return ''
      + '<article class="card">'
      +   '<div class="card-top">'
      +     '<span class="num">'+n.i+'</span>'
      +     '<span class="badge" data-g="'+n.g+'">'+esc(n.m)+'</span>'
      +     '<button class="star'+(on?" on":"")+'" data-i="'+n.i+'" title="'+(on?"取消收藏":"加入收藏")+'">'+(on?"★":"☆")+'</button>'
      +   '</div>'
      +   '<h2 class="title"><a href="'+n.u+'" target="_blank" rel="noopener">'+highlight(n.t)+'</a></h2>'
      +   '<div class="card-foot">'
      +     '<a class="btn primary" href="'+n.u+'" target="_blank" rel="noopener">'+ICON_LINK+'查看原文</a>'
      +     '<button class="btn share" data-u="'+n.u+'" title="复制链接">'
      +       '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5 15.4 17.5"/><path d="M15.4 6.5 8.6 10.5"/></svg>分享</button>'
      +     '<span class="host">'+hostOf(n.u)+'</span>'
      +   '</div>'
      + '</article>';
    }).join("");
  }

  /* 筛选状态提示 */
  const parts = [];
  parts.push(group === "全部" ? "全部来源" : "来源「"+group+"」");
  if(favOnly) parts.push("仅看收藏");
  if(keyword) parts.push('关键词「'+esc(keyword)+'」');
  document.getElementById("status").innerHTML =
    "当前筛选：" + parts.join(" · ") + "（<b>" + data.length + "</b> 条）";

  /* 页脚计数 */
  document.getElementById("footCount").textContent =
    (data.length === NEWS.length) ? ("共 "+NEWS.length+" 条新闻")
                                  : ("显示 "+data.length+" / "+NEWS.length+" 条新闻");

  /* 按钮激活态 */
  document.querySelectorAll(".chip[data-g]").forEach(function(b){
    b.classList.toggle("active", !favOnly && b.dataset.g === group);
  });
  const favBtn = document.getElementById("favBtn");
  favBtn.classList.toggle("active", favOnly);
  favBtn.firstChild.nodeValue = (favOnly ? "★" : "☆") + " 我的收藏 ";
  document.getElementById("favCount").textContent = favSet.size;
}

/* ---------------------- 事件绑定 ---------------------- */
/* 搜索：实时筛选 */
const searchEl = document.getElementById("search");
searchEl.addEventListener("input", function(){
  keyword = searchEl.value.trim();
  document.getElementById("clearSearch").style.display = keyword ? "block" : "none";
  render();
});
document.getElementById("clearSearch").addEventListener("click", function(){
  searchEl.value = ""; keyword = "";
  this.style.display = "none";
  render(); searchEl.focus();
});

/* 列表内事件委托：收藏 / 分享 */
document.getElementById("list").addEventListener("click", function(e){
  const star = e.target.closest(".star");
  if(star){
    const i = Number(star.dataset.i);
    if(favSet.has(i)){ favSet.delete(i); toast("已取消收藏"); }
    else{ favSet.add(i); toast("已加入收藏 ★"); }
    saveFav();
    render();
    return;
  }
  const share = e.target.closest(".share");
  if(share){
    copyText(share.dataset.u);
  }
});

/* 复制链接到剪贴板（带降级方案，兼容 file:// 打开） */
function copyText(text){
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text)
      .then(function(){ toast("链接已复制"); })
      .catch(function(){ fallbackCopy(text); });
  }else{
    fallbackCopy(text);
  }
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.cssText = "position:fixed;top:-1000px;opacity:0";
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try{ ok = document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
  toast(ok ? "链接已复制" : "复制失败，请手动复制");
}

/* 回到顶部：滚动超过 300px 显示 */
const toTop = document.getElementById("toTop");
window.addEventListener("scroll", function(){
  toTop.classList.toggle("show", window.scrollY > 300);
}, {passive:true});
toTop.addEventListener("click", function(){
  window.scrollTo({top:0, behavior:"smooth"});
});

/* ---------------------- 初始化 ---------------------- */
document.getElementById("statTotal").textContent = NEWS.length;
buildFilters();
render();
</script>
